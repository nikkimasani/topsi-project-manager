<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a25"><link rel="manifest" href="manifest.webmanifest"><title>Nikki Project Manager</title><style>
:root{--bg:#10121a;--panel:#191d29;--panel2:#222839;--line:#37415a;--ink:#f2f5ff;--muted:#a7b0c5;--a:#8976ff;--red:#ee6a7c;--green:#55c690;--amber:#f5b85b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{padding:20px 14px;background:#151824;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}.brand{font-size:17px;font-weight:800}.brand small,.muted{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:3px}.projects{display:grid;gap:4px;overflow:auto}.project,.nav{border:0;text-align:left;background:transparent;color:var(--muted);padding:10px;border-radius:8px;cursor:pointer}.project:hover,.project.on,.nav:hover{background:var(--panel2);color:white}.spacer{flex:1}.main{min-width:0}.top{padding:15px 24px;border-bottom:1px solid var(--line);background:#151824;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:3;flex-wrap:wrap}.title{font-size:19px;font-weight:800}.subtitle{color:var(--muted);font-size:12px}.search{margin-left:auto;max-width:300px;flex:1}.content{padding:22px 24px}.toolbar,.chips,.cardmeta,.taskactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:15px}.chips{margin-bottom:15px}.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(245px,1fr));gap:14px;align-items:start;overflow:auto;padding-bottom:24px}.col{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-height:330px;padding:11px}.colhead{color:var(--muted);font-weight:750;display:flex;justify-content:space-between;margin:3px 4px 10px}.drop{min-height:225px}.card{background:var(--panel2);border:1px solid #3b4760;border-radius:10px;padding:12px;margin:8px 0;cursor:grab}.card:active{cursor:grabbing}.card h3{font-size:14px;margin:0 0 7px}.desc{color:var(--muted);font-size:12px;line-height:1.35;white-space:pre-wrap;max-height:48px;overflow:hidden}.tag,.pill{background:#364262;color:#e1e6ff;border-radius:99px;padding:3px 7px;font-size:11px}.pill.high{background:#663342}.pill.medium{background:#614f2d}.pill.low{background:#284c45}.due.late{color:#ff9ba9}.done{text-decoration:line-through;opacity:.62}button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;background:var(--a);color:white;padding:9px 12px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button.ghost,.chip{background:transparent;color:var(--muted);border:1px solid var(--line)}.chip{padding:5px 9px;font-size:12px}.chip.on{color:#fff;background:var(--a);border-color:var(--a)}.danger{background:var(--red)}.add{width:100%;background:transparent;border:1px dashed #566480;color:var(--muted);margin-top:8px}input,textarea,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#111520;color:var(--ink)}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:9;padding:16px;place-items:center}.modal.show{display:grid}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:15px;width:min(650px,100%);max-height:94vh;overflow:auto;padding:20px}.dialog h2{margin:0 0 15px}.field{display:grid;gap:5px;color:var(--muted);font-size:12px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.views{display:grid;gap:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:90px;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--muted);font-size:11px}.event{background:#38436c;color:white;border-radius:5px;padding:4px;margin-top:4px;font-size:10px}.empty{color:var(--muted);font-size:12px;padding:12px 4px}.check{display:flex;gap:8px;align-items:center;color:var(--muted);margin:7px 0}.filelist{font-size:12px;color:var(--muted)}.mobile{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:inline-block}.top{padding:12px 15px}.content{padding:16px 15px}.search{order:3;margin:0;max-width:none;flex-basis:100%}.board{grid-template-columns:minmax(265px,88vw);grid-auto-flow:column;grid-auto-columns:minmax(265px,88vw)}.grid{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Nikki Project Manager <small id="syncState">Private workspace · this device</small></div><button id="newProject">+ New project</button><div class="projects" id="projects"></div><div class="spacer"></div><button class="nav" data-view="board">▦ Board</button><button class="nav" data-view="calendar">▣ Calendar</button><button class="nav" data-view="templates">✦ Templates</button><button class="nav" data-view="activity">◷ Activity</button><button class="nav" id="sync">☁ Cloud sync</button><small class="muted">Local-first, with export backups.</small></aside><main class="main"><header class="top"><button class="ghost mobile" id="newProjectMobile">Projects</button><div><div class="title" id="title"></div><div class="subtitle" id="sub"></div></div><input class="search" id="search" placeholder="Search tasks, tags, people…"><button class="ghost" id="undo">Undo</button><button class="ghost" id="guide">How to use</button><button class="ghost" id="backup">Export</button><button class="ghost" id="restore">Import</button></header><section class="content"><div class="toolbar"><button id="newTask">+ New task</button><button class="ghost" id="editProject">Project settings</button><button class="ghost" id="newMilestone">Milestone</button><button class="ghost" id="share">Share</button></div><div class="chips" id="filters"></div><div id="screen"></div></section></main></div><input id="importFile" type="file" accept="application/json" hidden><div class="modal" id="modal"><form class="dialog" id="form"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button class="ghost" type="button" id="cancel">Cancel</button><button id="save">Save</button></div></form></div><script>
const KEY='nikki-pm-v4',q=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let db=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[],active:null,view:'board',filter:'',history:[]};const now=()=>new Date().toISOString();function save(){localStorage.setItem(KEY,JSON.stringify(db))}function p(){return db.projects.find(x=>x.id===db.active)}function log(text){p().activity.unshift({id:uid(),text,at:now()})}function checkpoint(){db.history.push(JSON.stringify({projects:db.projects,active:db.active}));db.history=db.history.slice(-20)}function seed(){if(db.projects.length)return;let x={id:uid(),name:'Welcome workspace',description:'Plan the work that matters, then move it forward.',columns:['Inbox','In progress','Review','Done'],milestones:['Current sprint'],current:'Current sprint',people:['Nikki'],activity:[],tasks:[]};let t={id:uid(),title:'Make this board yours',description:'Open this task to add a due date, checklist, collaborators, and attachments.',column:'Inbox',milestone:'Current sprint',priority:'medium',due:'',tags:['welcome'],checklist:[{id:uid(),text:'Create a real project',done:false},{id:uid(),text:'Try dragging a task',done:false}],people:['Nikki'],comments:[],files:[],created:now()};x.tasks.push(t);x.activity.push({id:uid(),text:'Welcome workspace created',at:now()});db.projects=[x];db.active=x.id;save()}function modal(title,body,submit='Save',fn=()=>{}){q('#modalTitle').textContent=title;q('#modalBody').innerHTML=body;q('#save').textContent=submit;q('#modal').classList.add('show');q('#form').onsubmit=e=>{e.preventDefault();fn(new FormData(e.target));q('#modal').classList.remove('show');save();render()}}function close(){q('#modal').classList.remove('show')}function tags(){return [...new Set(p().tasks.flatMap(t=>t.tags||[]))].sort()}function visible(t){let x=(q('#search').value+'').toLowerCase(),f=db.filter;return (!f||t.tags.includes(f))&&(!x||[t.title,t.description,t.tags.join(' '),t.people.join(' ')].join(' ').toLowerCase().includes(x))}function due(t){if(!t.due)return'';let late=t.column!=='Done'&&new Date(t.due+'T23:59:59')<new Date();return `<span class="due ${late?'late':''}">${late?'Overdue · ':''}${esc(t.due)}</span>`}function card(t){let done=t.checklist.filter(x=>x.done).length,all=t.checklist.length;return `<article class="card ${t.column==='Done'?'done':''}" draggable="true" data-task="${t.id}"><h3>${esc(t.title)}</h3>${t.description?`<div class="desc">${esc(t.description)}</div>`:''}<div class="cardmeta"><span class="pill ${t.priority}">${esc(t.priority)}</span>${due(t)}${all?`<span>☑ ${done}/${all}</span>`:''}${t.people.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="cardmeta">${t.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}<button class="ghost" data-edit="${t.id}">Edit</button></div></article>`}function board(){let x=p();q('#screen').innerHTML=`<section class="board" style="--cols:${x.columns.length}">${x.columns.map(c=>{let ts=x.tasks.filter(t=>t.column===c&&visible(t));return `<section class="col" data-col="${esc(c)}"><div class="colhead"><span>${esc(c)}</span><span>${ts.length}</span></div><div class="drop">${ts.map(card).join('')||'<div class="empty">Nothing here yet.</div>'}</div><button class="add" data-add="${esc(c)}">+ Add task</button></section>`}).join('')}</section>`;q('#screen').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>task(p().tasks.find(t=>t.id===b.dataset.edit)));q('#screen').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>task(null,b.dataset.add));q('#screen').querySelectorAll('.card').forEach(e=>e.ondragstart=v=>v.dataTransfer.setData('task',e.dataset.task));q('#screen').querySelectorAll('.col').forEach(e=>{e.ondragover=v=>v.preventDefault();e.ondrop=v=>{let t=p().tasks.find(x=>x.id===v.dataTransfer.getData('task'));if(t&&t.column!==e.dataset.col){checkpoint();t.column=e.dataset.col;log(`${t.title} moved to ${e.dataset.col}`);save();render()}}})}function calendar(){let ts=p().tasks.filter(t=>t.due&&visible(t)).sort((a,b)=>a.due.localeCompare(b.due));q('#screen').innerHTML=`<div class="views"><h2>Upcoming work</h2><div class="calendar">${Array.from({length:28},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);let iso=d.toISOString().slice(0,10),a=ts.filter(t=>t.due===iso);return `<div class="day"><b>${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</b>${a.map(t=>`<div class="event" data-edit="${t.id}">${esc(t.title)}</div>`).join('')}</div>`}).join('')}</div><p class="muted">Add due dates to tasks to see them here.</p></div>`;q('#screen').querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>task(p().tasks.find(t=>t.id===e.dataset.edit)))}function templates(){let items=[['Launch plan','Research, prepare, launch, review.'],['Weekly planning','A lightweight weekly priorities board.'],['Content pipeline','Ideas, writing, editing, published.']];q('#screen').innerHTML=`<div class="views"><h2>Project templates</h2>${items.map((x,i)=>`<section class="col"><h3>${x[0]}</h3><p class="muted">${x[1]}</p><button data-template="${i}">Use template</button></section>`).join('')}</div>`;q('#screen').querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{let n=[['Launch plan',['Research','Prepare','Launch','Review']],['Weekly planning',['Backlog','This week','Done']],['Content pipeline',['Ideas','Writing','Editing','Published']]][b.dataset.template];project({name:n[0],columns:n[1]})})}function activity(){q('#screen').innerHTML=`<div class="views"><h2>Activity</h2>${p().activity.map(a=>`<section class="col"><b>${esc(a.text)}</b><div class="muted">${new Date(a.at).toLocaleString()}</div></section>`).join('')||'<p class="empty">Activity will appear as you work.</p>'}</div>`}function render(){seed();let x=p();q('#title').textContent=x.name;q('#sub').textContent=x.description+' · '+x.current;q('#projects').innerHTML=db.projects.map(a=>`<button class="project ${a.id===x.id?'on':''}" data-project="${a.id}">${esc(a.name)}</button>`).join('');q('#filters').innerHTML=`<button class="chip ${!db.filter?'on':''}" data-filter="">All tasks</button>`+tags().map(t=>`<button class="chip ${db.filter===t?'on':''}" data-filter="${esc(t)}">#${esc(t)}</button>`).join('');q('#projects').querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{db.active=b.dataset.project;save();render()});q('#filters').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{db.filter=b.dataset.filter;render()});({board,calendar,templates,activity})[db.view]()}function task(t=null,column='Inbox'){let x=p(),isNew=!t;t=t||{id:uid(),title:'',description:'',column,milestone:x.current,priority:'medium',due:'',tags:[],checklist:[],people:[],comments:[],files:[],created:now()};modal(isNew?'New task':'Edit task',`<label class="field">Task name<input name="title" required value="${esc(t.title)}"></label><label class="field">Details<textarea name="description" rows="3">${esc(t.description)}</textarea></label><div class="grid"><label class="field">Column<select name="column">${x.columns.map(c=>`<option ${c===t.column?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label class="field">Priority<select name="priority">${['low','medium','high'].map(c=>`<option ${c===t.priority?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Due date<input name="due" type="date" value="${t.due}"></label><label class="field">Milestone<select name="milestone">${x.milestones.map(c=>`<option ${c===t.milestone?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div><label class="field">Tags <input name="tags" value="${esc(t.tags.join(', '))}" placeholder="client, urgent"></label><label class="field">Collaborators <input name="people" value="${esc(t.people.join(', '))}" placeholder="Nikki, teammate"></label><label class="field">Checklist (one item per line)<textarea name="checks" rows="4">${t.checklist.map(c=>`${c.done?'[x] ':'[ ] '}${c.text}`).join('\n')}</textarea></label><label class="field">Attachment <input name="file" type="file"></label><div class="filelist">${t.files.map(f=>esc(f.name)).join('<br>')}</div><label class="field">Add a comment<textarea name="comment" rows="2" placeholder="Leave a note for collaborators"></textarea></label>${isNew?'':'<button type="button" class="danger" id="delete">Delete task</button>'}`,'Save task',fd=>{checkpoint();Object.assign(t,{title:fd.get('title'),description:fd.get('description'),column:fd.get('column'),milestone:fd.get('milestone'),priority:fd.get('priority'),due:fd.get('due'),tags:String(fd.get('tags')).split(',').map(x=>x.trim()).filter(Boolean),people:String(fd.get('people')).split(',').map(x=>x.trim()).filter(Boolean),checklist:String(fd.get('checks')).split('\n').filter(Boolean).map(s=>({id:uid(),done:/^\[x\]/i.test(s),text:s.replace(/^\[[ x]\]\s*/i,'')}))});let f=fd.get('file');if(f?.size)t.files.push({name:f.name,size:f.size});let c=String(fd.get('comment')).trim();if(c)t.comments.push({text:c,at:now()});if(isNew)x.tasks.push(t);log(isNew?`${t.title} created`:`${t.title} updated`)});if(!isNew)q('#delete').onclick=()=>{checkpoint();x.tasks=x.tasks.filter(a=>a.id!==t.id);log(`${t.title} deleted`);close();save();render()}}function project(preset){modal('New project',`<label class="field">Project name<input name="name" required value="${esc(preset?.name)}"></label><label class="field">Description<textarea name="description" rows="3"></textarea></label><label class="field">Columns<input name="cols" value="${esc((preset?.columns||['Inbox','In progress','Review','Done']).join(', '))}"></label>`,'Create project',fd=>{let x={id:uid(),name:fd.get('name'),description:fd.get('description'),columns:String(fd.get('cols')).split(',').map(s=>s.trim()).filter(Boolean),milestones:['Current sprint'],current:'Current sprint',people:['Nikki'],tasks:[],activity:[]};x.activity.push({id:uid(),text:'Project created',at:now()});db.projects.push(x);db.active=x.id;db.view='board'})}
q('#newProject').onclick=()=>project();q('#newProjectMobile').onclick=()=>project();q('#newTask').onclick=()=>task();q('#search').oninput=render;q('#cancel').onclick=close;q('#guide').onclick=()=>modal('How to use','<p><b>1. Plan:</b> create a project or start from a template.</p><p><b>2. Capture:</b> add tasks with dates, priority, tags, checklists, people and attachments.</p><p><b>3. Move:</b> drag cards across board columns as work progresses.</p><p><b>4. Review:</b> use Calendar for dated work and Activity for the project history.</p><p><b>5. Protect:</b> Export a backup. Cloud Sync will make work available on every device once connected.</p>','Close');q('#undo').onclick=()=>{let s=db.history.pop();if(s){let x=JSON.parse(s);db.projects=x.projects;db.active=x.active;save();render()}};q('#backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='nikki-project-manager-backup.json';a.click()};q('#restore').onclick=()=>q('#importFile').click();q('#importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.projects)throw 0;db=x;save();render()}catch{alert('Choose a valid Project Manager backup.')}};q('#newMilestone').onclick=()=>modal('New milestone','<label class="field">Milestone name<input name="name" required placeholder="e.g. April release"></label>','Add',fd=>{p().milestones.push(fd.get('name'));p().current=fd.get('name');log(`Milestone ${fd.get('name')} added`)});q('#editProject').onclick=()=>modal('Project settings',`<label class="field">Name<input name="name" required value="${esc(p().name)}"></label><label class="field">Description<textarea name="description">${esc(p().description)}</textarea></label><label class="field">Columns<input name="cols" value="${esc(p().columns.join(', '))}"></label>`,'Save',fd=>{checkpoint();p().name=fd.get('name');p().description=fd.get('description');p().columns=String(fd.get('cols')).split(',').map(s=>s.trim()).filter(Boolean);log('Project settings updated')});q('#share').onclick=()=>modal('Share project','<p>Cloud sharing is ready to connect. Once cloud sync is provisioned, you will be able to invite people by email, assign them to tasks, and keep every device in sync.</p>','Close');q('#sync').onclick=()=>modal('Cloud sync','<p><b>Cloud sync setup is pending.</b></p><p>This app already supports local backups and offline use. Connecting a secure hosted workspace adds sign-in, sharing, automatic device sync, and stored attachments.</p>','Close');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{db.view=b.dataset.view;render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script><script>document.getElementById('newProjectMobile').textContent='+ Project';</script></body></html>
