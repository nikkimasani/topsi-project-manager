<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nikki Project Manager</title><style>
:root{--bg:#10131a;--panel:#181d28;--line:#293246;--ink:#ecf1fa;--muted:#aab5c8;--accent:#8b7cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}header{padding:20px max(20px,5vw);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:#151923;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}button,input,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:var(--accent);color:white;cursor:pointer}.subtle{background:#272f40}.wrap{padding:24px max(20px,5vw)}.projectbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.projectbar input{flex:1;min-width:180px}.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:16px;align-items:start}.column{min-height:310px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}.column h2{font-size:15px;margin:0 0 12px;color:var(--muted);display:flex;justify-content:space-between}.card{background:#202737;border:1px solid #35415a;border-radius:10px;padding:12px;margin:9px 0;cursor:grab}.card p{margin:5px 0 0;color:var(--muted);font-size:14px;white-space:pre-wrap}.add{width:100%;background:transparent;color:var(--muted);border:1px dashed #46546e;margin-top:7px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#0009}.modal.show{display:grid}.dialog{max-width:460px;width:100%;background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:15px}.dialog input,.dialog textarea{width:100%;border-radius:8px;border:1px solid var(--line);background:#10131a;color:var(--ink);padding:10px;margin:7px 0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.hint{color:var(--muted);font-size:13px;margin:0 0 18px}@media(max-width:760px){.board{grid-template-columns:1fr}header{position:sticky;top:0;z-index:3}}
</style></head><body><header><h1>Nikki Project Manager</h1><div><button class="subtle" id="export">Export</button> <button class="subtle" id="import">Import</button> <button id="newProject">New project</button></div></header><main class="wrap"><div class="projectbar"><input id="projectName" aria-label="Project name"><button class="subtle" id="rename">Rename</button></div><p class="hint">Your board is saved privately in this browser. Drag cards between columns; export a backup before changing devices.</p><section class="board" id="board"></section></main><input type="file" id="file" accept="application/json" hidden><div class="modal" id="modal"><form class="dialog" id="form"><h2 id="dialogTitle">Add task</h2><input id="taskTitle" required placeholder="Task title"><textarea id="taskNotes" rows="4" placeholder="Notes (optional)"></textarea><input id="target" type="hidden"><div class="actions"><button type="button" class="subtle" id="cancel">Cancel</button><button>Save task</button></div></form></div><script>
const KEY='nikki-project-manager-web-v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{project:'My project',columns:[{id:'todo',name:'To do',cards:[]},{id:'doing',name:'In progress',cards:[]},{id:'done',name:'Done',cards:[]}]};const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){$('#projectName').value=state.project;$('#board').innerHTML=state.columns.map(c=>`<section class="column" data-column="${c.id}"><h2>${c.name}<span>${c.cards.length}</span></h2><div class="cards">${c.cards.map(x=>`<article class="card" draggable="true" data-id="${x.id}"><strong>${esc(x.title)}</strong>${x.notes?`<p>${esc(x.notes)}</p>`:''}</article>`).join('')}</div><button class="add" data-add="${c.id}">+ Add task</button></section>`).join('');bind()}function bind(){document.querySelectorAll('.add').forEach(b=>b.onclick=()=>open(b.dataset.add));document.querySelectorAll('.card').forEach(c=>{c.ondragstart=e=>e.dataTransfer.setData('id',c.dataset.id)});document.querySelectorAll('.column').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=e=>{const id=e.dataTransfer.getData('id');let card;state.columns.forEach(x=>{const i=x.cards.findIndex(z=>z.id===id);if(i>-1)card=x.cards.splice(i,1)[0]});const dest=state.columns.find(x=>x.id===c.dataset.column);if(card)dest.cards.push(card);save();render()}})}function open(col){$('#target').value=col;$('#taskTitle').value='';$('#taskNotes').value='';$('#modal').classList.add('show');$('#taskTitle').focus()}$('#form').onsubmit=e=>{e.preventDefault();const col=state.columns.find(c=>c.id===$('#target').value);col.cards.push({id:crypto.randomUUID(),title:$('#taskTitle').value,notes:$('#taskNotes').value});save();$('#modal').classList.remove('show');render()};$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#rename').onclick=()=>{const n=$('#projectName').value.trim();if(n){state.project=n;save();render()}};$('#newProject').onclick=()=>{if(confirm('Start a new empty project?')){state={project:'New project',columns:state.columns.map(c=>({id:c.id,name:c.name,cards:[]}))};save();render()}};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='nikki-project-board.json';a.click();URL.revokeObjectURL(a.href)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!data.columns)throw 0;state=data;save();render()}catch{alert('Please choose a valid Nikki Project Manager export.')}};render();
</script></body></html>
