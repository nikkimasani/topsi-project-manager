<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nikki Project Manager</title><style>
:root{--bg:#11131a;--panel:#191d28;--panel2:#222838;--line:#343e55;--ink:#f1f5ff;--muted:#a8b2c7;--accent:#8976ff;--danger:#ee6a7c;--shadow:0 10px 32px #0003}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:265px 1fr}.sidebar{padding:20px 14px;background:#151924;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px}.brand{font-weight:800;font-size:17px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.project-list{display:grid;gap:5px;overflow:auto}.project{border:0;text-align:left;color:var(--muted);background:transparent;padding:10px;border-radius:9px;cursor:pointer}.project.active,.project:hover{background:var(--panel2);color:var(--ink)}.sidebar-footer{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.5}button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;background:var(--accent);color:white;padding:9px 12px;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.08)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:var(--danger)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#11151f;color:var(--ink);padding:9px}.main{min-width:0}.top{padding:17px 26px;border-bottom:1px solid var(--line);background:#151924;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:4}.top h1{font-size:19px;margin:0;white-space:nowrap}.top h1 span{font-size:12px;color:var(--muted);font-weight:500;display:block;margin-top:3px}.search{max-width:360px;margin-left:auto;position:relative}.search input{padding-left:32px}.search:before{content:'⌕';position:absolute;left:11px;top:7px;color:var(--muted);font-size:19px}.content{padding:22px 26px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 9px;font-size:12px}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(240px,1fr));gap:14px;align-items:start;overflow:auto;padding-bottom:20px}.column{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-height:300px;padding:11px}.column-header{display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--muted);font-weight:750;margin:3px 3px 11px}.count{font-size:11px;border-radius:99px;background:#30394e;padding:3px 7px}.drop{min-height:190px}.note{padding:12px;background:var(--panel2);border:1px solid #3a455e;border-radius:10px;margin:8px 0;box-shadow:0 2px 8px #0002;cursor:grab}.note:active{cursor:grabbing}.note h3{font-size:14px;margin:0 0 7px}.note .body{color:var(--muted);line-height:1.4;white-space:pre-wrap;font-size:13px;max-height:74px;overflow:hidden}.note img{width:100%;max-height:140px;object-fit:cover;border-radius:7px;margin-top:9px}.note-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:10px;color:var(--muted);font-size:11px}.tags{display:flex;flex-wrap:wrap;gap:4px}.tag{background:#354062;color:#dbe2ff;padding:3px 6px;border-radius:99px}.add-note{width:100%;margin-top:8px;background:transparent;border:1px dashed #55637f;color:var(--muted)}.empty{color:var(--muted);padding:16px 4px;font-size:13px}.modal{position:fixed;inset:0;z-index:9;background:#0009;display:none;place-items:center;padding:18px}.modal.show{display:grid}.dialog{width:min(580px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px}.dialog h2{margin:0 0 16px;font-size:19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin:10px 0;color:var(--muted);font-size:12px}.dialog textarea{resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.small{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.image-preview{display:none;max-width:130px;max-height:90px;border-radius:7px}.mobile-projects{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-projects{display:block}.top{padding:12px 15px}.top h1{font-size:16px}.content{padding:17px 15px}.board{grid-template-columns:minmax(265px,88vw);grid-auto-flow:column;grid-auto-columns:minmax(265px,88vw);overflow-x:auto}.search{order:3;margin-left:0;max-width:none;width:100%}.top{flex-wrap:wrap}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Nikki Project Manager<small>Private browser workspace</small></div><button id="newProject">+ New project</button><div class="project-list" id="projects"></div><div class="sidebar-footer">Stored only on this device.<br>Use Export to move or back up projects.</div></aside><main class="main"><header class="top"><button class="ghost mobile-projects" id="mobileProjects">Projects</button><h1 id="projectTitle">Project <span id="projectDescription"></span></h1><div class="search"><input id="search" placeholder="Search notes or tags"></div><button class="ghost" id="export">Export</button><button class="ghost" id="import">Import</button><button class="ghost" id="guide">How to use</button><button class="ghost" id="settings">Settings</button></header><section class="content"><div class="controls"><button id="newNote">+ New note</button><button class="ghost" id="editProject">Edit project</button><button class="ghost" id="milestones">Milestones</button><span class="small" id="milestoneLabel"></span></div><div class="chips" id="tagFilters"></div><section class="board" id="board"></section></section></main></div><input id="file" type="file" accept="application/json" hidden><div class="modal" id="modal"><form class="dialog" id="form"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialog-actions"><button type="button" class="ghost" id="cancel">Cancel</button><button id="save">Save</button></div></form></div><script>
const KEY='nikki-project-manager-v3', $=s=>document.querySelector(s),id=()=>crypto.randomUUID();let db=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[],active:null,settings:{dark:true}},filter='';function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function project(){return db.projects.find(p=>p.id===db.active)}function seed(){if(db.projects.length)return;let p={id:id(),title:'Welcome to your workspace',description:'A calm place to plan work, milestones, and next steps.',categories:[{id:'todo',name:'To do'},{id:'progress',name:'In progress'},{id:'done',name:'Done'}],milestones:[{id:'default',name:'Current'}],milestone:'default',notes:[{id:id(),title:'Start here',body:'Create a new project from the left sidebar, or add your first task to this sample board. Your work stays in this browser until you export a backup.',category:'todo',milestone:'default',tags:['welcome']} ]};db.projects=[p];db.active=p.id;persist()}function esc(s=''){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function tags(){return [...new Set(project().notes.flatMap(n=>n.tags||[]))].sort()}function render(){seed();let p=project();if(!p){db.active=db.projects[0]?.id; p=project()}$('#projects').innerHTML=db.projects.map(x=>`<button class="project ${x.id===p.id?'active':''}" data-project="${x.id}">${esc(x.title)}</button>`).join('');$('#projectTitle').firstChild.textContent=p.title+' ';$('#projectDescription').textContent=p.description||'';$('#milestoneLabel').textContent='Milestone: '+(p.milestones.find(x=>x.id===p.milestone)?.name||'Current');let ts=tags();$('#tagFilters').innerHTML=`<button class="chip ${!filter?'on':''}" data-tag="">All notes</button>`+ts.map(t=>`<button class="chip ${filter===t?'on':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');let q=$('#search').value.toLowerCase();let visible=n=>n.milestone===p.milestone&&(!filter||n.tags?.includes(filter))&&(!q||[n.title,n.body,(n.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));$('#board').style.setProperty('--cols',p.categories.length);$('#board').innerHTML=p.categories.map(c=>{let notes=p.notes.filter(n=>n.category===c.id&&visible(n));return `<section class="column" data-column="${c.id}"><div class="column-header"><span>${esc(c.name)}</span><span class="count">${notes.length}</span></div><div class="drop">${notes.map(note).join('')||'<div class="empty">No notes here yet.</div>'}</div><button class="add-note" data-add="${c.id}">+ Add note</button></section>`}).join('');bind()}function note(n){return `<article class="note" draggable="true" data-note="${n.id}"><h3>${esc(n.title)}</h3>${n.body?`<div class="body">${esc(n.body)}</div>`:''}${n.image?`<img src="${n.image}" alt="">`:''}<div class="note-foot"><div class="tags">${(n.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><button class="ghost edit-note" data-edit="${n.id}">Edit</button></div></article>`}function bind(){document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{db.active=b.dataset.project;filter='';persist();render()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{filter=b.dataset.tag;render()});document.querySelectorAll('[data-add]').forEach(b=>openNote(null,b.dataset.add));document.querySelectorAll('[data-edit]').forEach(b=>openNote(project().notes.find(n=>n.id===b.dataset.edit)));document.querySelectorAll('.note').forEach(n=>n.ondragstart=e=>e.dataTransfer.setData('note',n.dataset.note));document.querySelectorAll('.column').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=e=>{let n=project().notes.find(n=>n.id===e.dataTransfer.getData('note'));if(n){n.category=c.dataset.column;persist();render()}}})}function modal(title,html,onSave){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show');$('#form').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target));$('#modal').classList.remove('show');persist();render()}}function openNote(n=null,category){let p=project();modal(n?'Edit note':'New note',`<label class="field">Title<input name="title" required value="${esc(n?.title)}"></label><label class="field">Description<textarea name="body" rows="5">${esc(n?.body)}</textarea></label><div class="grid2"><label class="field">Column<select name="category">${p.categories.map(c=>`<option value="${c.id}" ${(n?.category||category)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field">Tags <input name="tags" value="${esc((n?.tags||[]).join(', '))}" placeholder="work, urgent"></label></div><label class="field">Image attachment <input name="image" type="file" accept="image/*"></label><p class="small">Images are stored locally with this project; keep them small.</p>${n?'<button type="button" class="danger" id="deleteNote">Delete note</button>':''}`,fd=>{if(n){n.title=fd.get('title');n.body=fd.get('body');n.category=fd.get('category');n.tags=String(fd.get('tags')).split(',').map(x=>x.trim()).filter(Boolean);let f=fd.get('image');if(f?.size){let r=new FileReader();r.onload=()=>{n.image=r.result;persist();render()};r.readAsDataURL(f)}}else{let nn={id:id(),title:fd.get('title'),body:fd.get('body'),category:fd.get('category'),milestone:p.milestone,tags:String(fd.get('tags')).split(',').map(x=>x.trim()).filter(Boolean)};let f=fd.get('image');if(f?.size){let r=new FileReader();r.onload=()=>{nn.image=r.result;p.notes.push(nn);persist();render()};r.readAsDataURL(f)}else p.notes.push(nn)}});if(n)$('#deleteNote').onclick=()=>{p.notes=p.notes.filter(x=>x.id!==n.id);$('#modal').classList.remove('show');persist();render()}}function openProject(existing=null){modal(existing?'Edit project':'New project',`<label class="field">Project name<input name="title" required value="${esc(existing?.title)}"></label><label class="field">Description<textarea name="description" rows="3">${esc(existing?.description)}</textarea></label><label class="field">Columns (comma separated)<input name="columns" value="${esc(existing?.categories.map(c=>c.name).join(', ')||'To do, In progress, Done')}"></label>${existing?'<button type="button" class="danger" id="deleteProject">Delete project</button>':''}`,fd=>{let names=String(fd.get('columns')).split(',').map(x=>x.trim()).filter(Boolean);if(existing){existing.title=fd.get('title');existing.description=fd.get('description');existing.categories=names.map((name,i)=>({id:existing.categories[i]?.id||id(),name}))}else{let p={id:id(),title:fd.get('title'),description:fd.get('description'),categories:names.map(name=>({id:id(),name})),milestones:[{id:'default',name:'Current'}],milestone:'default',notes:[]};db.projects.push(p);db.active=p.id}});if(existing)$('#deleteProject').onclick=()=>{if(confirm('Delete this project?')){db.projects=db.projects.filter(p=>p.id!==existing.id);db.active=db.projects[0]?.id;$('#modal').classList.remove('show');persist();render()}}}function openMilestones(){let p=project();modal('Milestones',`<label class="field">Current milestone<select name="current">${p.milestones.map(m=>`<option value="${m.id}" ${m.id===p.milestone?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label class="field">Add milestone<input name="new" placeholder="e.g. Release 1"></label>`,fd=>{p.milestone=fd.get('current');let name=String(fd.get('new')).trim();if(name){let m={id:id(),name};p.milestones.push(m);p.milestone=m.id}})}$('#newProject').onclick=()=>openProject();$('#editProject').onclick=()=>openProject(project());$('#newNote').onclick=()=>openNote();$('#milestones').onclick=openMilestones;$('#search').oninput=render;$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='nikki-project-manager-backup.json';a.click();URL.revokeObjectURL(a.href)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.projects))throw 0;db=x;persist();filter='';render()}catch{alert('Choose a valid Nikki Project Manager backup.')}};$('#settings').onclick=()=>modal('About this app','<p class="small">Nikki Project Manager runs entirely in your browser. Projects, notes, tags, milestones, images, and settings stay private to this browser until you export them.</p>',()=>{});$('#mobileProjects').onclick=()=>{$('#projects').scrollIntoView({behavior:'smooth'})};render();
</script><style>.search:before{display:none!important}</style><script>document.getElementById('modal').classList.remove('show');document.getElementById('guide').onclick=()=>modal('How to use this board','<p class="small"><strong>1. Create a project</strong> with the left-side button. Customize its columns when you create or edit it.</p><p class="small"><strong>2. Add notes</strong> with any + Add note button, then assign a column, tags, and an optional image.</p><p class="small"><strong>3. Move work forward</strong> by dragging notes between columns. Use Milestones to switch between phases.</p><p class="small"><strong>4. Find anything</strong> with search or a tag filter.</p><p class="small"><strong>5. Keep a backup</strong> with Export; Import restores a saved workspace on another device.</p>',()=>{});</script></body></html>
